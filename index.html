-card{display:grid;gap:12px}.project-art{height:125px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.asset-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.asset{padding:0;overflow:hidden}.asset-thumb{height:175px;background:var(--surface-2);display:grid;place-items:center}.asset-thumb img,.asset-thumb video{width:100%;height:100%;object-fit:cover}.asset-body{padding:12px;display:grid;gap:6px}.asset-body small{font-size:9px}.history-row{display:grid;grid-template-columns:1fr auto;gap:8px}.empty{text-align:center;padding:40px 15px;line-height:1.7}.big-icon{font-size:28px}.site-footer{padding:18px 30px;border-top:1px solid var(--line);font-size:9px;letter-spacing:1.5px;color:var(--muted)}.site-footer strong{color:var(--text);margin-left:6px}.site-footer i{margin:0 6px}.footer-note{float:right}.mobile-overlay{display:none}

.embedded-loading{min-height:calc(100vh - 150px);display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.04em;background:radial-gradient(circle at 50% 15%,rgba(139,92,246,.16),transparent 38%),rgba(10,10,28,.28);border:1px solid var(--line);border-radius:18px}.embedded-loading:after{content:"";width:18px;height:18px;margin-left:10px;border:2px solid var(--line);border-top-color:var(--accent-2);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Social Media Tools — compact, mobile-first cleanup */
.socially-layout{align-items:start;gap:16px}
.socially-layout .form-card{padding:18px;min-width:0}
.socially-layout .result-card{padding:18px;min-width:0}
.socially-layout .notice{font-size:10px;line-height:1.45;padding:10px 12px}
.socially-layout .form{gap:12px}
.socially-layout .field label{font-size:9px;letter-spacing:1.4px}
.socially-layout .field input,
.socially-layout .field select{min-height:44px;font-size:13px}
.socially-layout .row{display:flex;flex-wrap:wrap;gap:8px}
.socially-layout .row .btn{min-height:42px}
.social-supported{margin-top:14px;padding:12px 13px;border:1px solid var(--line);background:var(--surface-2);display:grid;gap:5px;color:var(--muted);font-size:10px;line-height:1.5}
.social-supported b{font-size:10px;color:var(--text);letter-spacing:.2px}
.social-supported span{display:block}
.social-supported strong{color:var(--text)}
.social-supported small{font-size:9px;line-height:1.45}
.socially-layout .quality-toggle{grid-template-columns:1fr 1fr;padding:4px;gap:4px;border-radius:9px}
.socially-layout .quality-choice{min-height:40px;font-size:11px;padding:7px 6px;border-radius:7px}
.socially-layout .quality-select{grid-column:1/-1;width:100%;min-height:42px}
.socially-layout .language-toggle{grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:9px}
.socially-layout .language-choice{min-height:40px;font-size:10px;padding:7px 5px;border-radius:7px}
.socially-layout .language-choice:last-child{grid-column:auto}
.socially-layout .preview{min-height:360px;margin-top:10px}
.socially-layout .empty{max-width:360px;padding:26px 14px;font-size:11px}
.socially-layout .empty p{font-size:10px;line-height:1.5}
.social-picker,.social-download-result{width:100%;max-width:620px}
.social-item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);margin-top:7px;background:var(--surface)}
.social-item img{width:52px;height:40px;object-fit:cover}
.social-item b,.social-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.social-item b{font-size:10px}.social-item small{font-size:8px;color:var(--muted);margin-top:2px}
@media(max-width:820px){
  .content{padding:14px 10px 22px}
  .section-head{margin:2px 2px 14px;gap:8px}
  .section-head .status-pill{display:none}
  .section-head h2{font-size:27px;line-height:1.05;margin:3px 0 5px}
  .section-head p{font-size:10px;line-height:1.45;margin:0;max-width:100%}
  .socially-layout{gap:10px}
  .socially-layout .form-card,.socially-layout .result-card{padding:13px}
  .socially-layout .grid.two{gap:9px}
  .socially-layout .preview{min-height:250px}
}
@media(max-width:500px){
  .topbar{height:60px;gap:7px;padding:0 10px}
  .mobile-brand{font-size:14px}
  .theme-switch{width:96px;height:34px}
  .theme-switch .theme-dot{width:44px;height:26px}
  .theme-switch.is-dark .theme-dot{transform:translateX(46px)}
  .theme-switch .theme-label{font-size:7px}
  .socially-layout .grid.two{grid-template-columns:1fr}
  .socially-layout .quality-toggle{grid-template-columns:1fr 1fr}
  .socially-layout .language-toggle{grid-template-columns:repeat(2,1fr)}
  .socially-layout .language-choice:last-child{grid-column:1/-1}
  .socially-layout .row{display:grid;grid-template-columns:1fr auto}
  .socially-layout .row .btn{width:100%}
  .social-supported{font-size:9px;padding:10px}
}
/* Social Media Tools — unified selector treatment */
.socially-layout .quality-toggle,
.socially-layout .language-toggle{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px}
.socially-layout .quality-choice,
.socially-layout .language-choice{min-height:42px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;font-weight:850}
.socially-layout .quality-choice.active,
.socially-layout .language-choice.active{background:var(--accent);border-color:var(--accent);color:var(--bg);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.socially-layout .quality-select{grid-column:1/-1;width:100%;min-height:42px}
.socially-layout .language-choice:last-child{grid-column:1/-1}
@media(max-width:600px){.socially-layout .quality-toggle,.socially-layout .language-toggle{grid-template-columns:1fr 1fr}.socially-layout .quality-choice,.socially-layout .language-choice{min-height:44px;font-size:11px}.socially-layout .quality-select{grid-column:1/-1}.socially-layout .language-choice:last-child{grid-column:1/-1}}

/* Social platform workspace */
.social-platforms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0 16px}
.social-platform{min-height:58px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:9px 10px;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease}
.social-platform:hover{transform:translateY(-1px);border-color:var(--accent)}
.social-platform.active{background:var(--accent);color:#111;border-color:var(--accent);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.platform-mark{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent);font-size:12px;flex:0 0 auto}
.social-source-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.social-source-head strong{display:block;font-size:20px;margin-top:3px}
.source-dot{font-size:10px;letter-spacing:.12em;font-weight:800;padding:7px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.social-platform-note{display:grid;gap:4px;margin-top:14px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,var(--accent))}
.social-platform-note b{font-size:13px}
.social-platform-note span{font-size:12px;line-height:1.55;color:var(--muted)}
@media(max-width:900px){
 .social-platforms{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .social-platform{min-height:52px;padding:8px 6px;font-size:12px}
 .platform-mark{width:22px;height:22px}
}
@media(max-width:560px){
 .social-platforms{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}

:root{

  --card-radius:22px;
}

html{scroll-behavior:smooth}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

  content:"";position:absolute;inset:-70%;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);

.hero-orb{animation:orbFloat 5s ease-in-out infinite;transform-origin:center;position:relative;overflow:hidden}

function renderEmbeddedPage(v,page){
  const frame=document.createElement('iframe');
  frame.className='embedded-tool-frame';
  frame.title=page==='movies'?'ITFM AI Movies':'Downloader';
  frame.loading='eager';
  frame.style.cssText='display:block;width:100%;min-height:calc(100vh - 110px);height:1000px;border:0;border-radius:18px;background:transparent;';
  v.innerHTML='<div class="embedded-loading" role="status">Loading tool…</div>';v.appendChild(frame);
  const resize=e=>{if(e.source===frame.contentWindow&&e.data&&e.data.type==='itfm-embedded-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(700,Math.min(100000,e.data.height+24))+'px'};
  window.addEventListener('message',resize);
  frame.addEventListener('load',()=>{const loading=v.querySelector('.embedded-loading');if(loading)loading.remove();try{frame.contentWindow.postMessage({type:'itfm-theme',theme:document.documentElement.dataset.theme||'dark'},location.origin);if(page==='downloader'){const doc=frame.contentDocument;if(doc&&!doc.getElementById('itfm-embedded-theme')){const style=doc.createElement('style');style.id='itfm-embedded-theme';style.textContent=':root{--bg:#090714!important;--panel:#100d1d!important;--line:#302a49!important;--text:#f8f7ff!important;--muted:#aaa4bd!important;--accent:#8b5cf6!important}body{background:radial-gradient(circle at 12% 8%,rgba(34,211,238,.16),transparent 28%),radial-gradient(circle at 88% 16%,rgba(236,72,153,.14),transparent 28%),#090714!important;color:var(--text)!important}body>*,.wrap{color:var(--text)!important}.card{background:linear-gradient(135deg,#100d1d,#211b38)!important;border-color:#463d70!important;box-shadow:0 18px 55px rgba(3,0,18,.34)!important}.tag,.btn,.button{border-radius:999px!important}.btn,.button{background:linear-gradient(135deg,#8b5cf6,#06b6d4 48%,#ec4899)!important;border:0!important;color:#fff!important}.input,input,select,textarea{background:#100d1d!important;color:#f8f7ff!important;border-color:#463d70!important}h1,h2{background:linear-gradient(135deg,#8b5cf6,#06b6d4 48%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent!important}';doc.head.appendChild(style)}}}catch{};if(!frame.isConnected)window.removeEventListener('message',resize)});
  const bytes=Uint8Array.from(atob(EMBEDDED_PAGES[page]),c=>c.charCodeAt(0));
  let html=new TextDecoder().decode(bytes);
  html=html.replace(/<head>/i,'<head><base href="'+location.origin+'/">');
  html=html.replace(/<option value="tiktok">TikTok<\/option>/gi,'');
  html=html.replace(/TikTok video\/share link or direct/gi,'video share link or direct');
  html=html.replace(/https:\/\/www\.tiktok\.com\/@user\/video\/\.\.\./gi,'');
  html=html.replace(/TikTok download service/gi,'Social media download service');
  html=html.replace(/TikTok video and audio links/gi,'Social media video and audio links');
  html=html.replace(/video\/share link or direct/g,'link or direct');
  const resizeScript=`<script>(function(){function sendHeight(){parent.postMessage({type:'itfm-embedded-height',height:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},location.origin)}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);new MutationObserver(sendHeight).observe(document.documentElement,{childList:true,subtree:true,attributes:true});setTimeout(sendHeight,200);setTimeout(sendHeight,1000);})();<\/script>`;
  html=html.replace(/<\/body>/i,resizeScript+'</body>');
  frame.srcdoc=html;
}

const ASSET_DB='itfmai-assets-v1';
function assetDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(ASSET_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('blobs'))r.result.createObjectStore('blobs')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

function pollGeneration(provider,id,result,type,prompt,attempt=0,model=''){if(!id){result.innerHTML='<div class="notice"><b>Provider returned no job ID.</b></div>';return}if(attempt>80){result.innerHTML='<div class="notice"><b>Generation is taking longer than this page will wait.</b><span>The provider job is still real and can be checked again later.</span></div>';saveHistory(type,prompt,'timeout',{provider});return}setTimeout(async()=>{try{const q=`/api/status?provider=${encodeURIComponent(provider)}&id=${encodeURIComponent(id)}&model=${encodeURIComponent(model||'')}`;const r=await fetch(q,{headers:apiHeaders(keyIdForProvider(provider))});const d=await r.json();if(!r.ok)throw new Error(d.error||'Status check failed');if(d.status==='completed'&&(d.url||d.kind)){renderMediaResult(result,{kind:d.kind||'video',url:d.url,provider},type,prompt);return}if(d.status==='failed')throw new Error(d.error||'Provider generation failed.');const n=result.querySelector('.notice span');if(n)n.textContent=`Provider status: ${d.status||'processing'}…`;pollGeneration(provider,id,result,type,prompt,attempt+1,model)}catch(e){result.innerHTML=`<div class="notice"><b>${esc(e.message)}</b><span>No fake output was generated.</span></div>`;saveHistory(type,prompt,'failed',{provider})}},Math.min(15000,3500+attempt*500))}

async function loadExternalScript(src){
  if(document.querySelector(`script[data-external-src="${src}"]`)) return;
  await new Promise((resolve,reject)=>{
    const el=document.createElement('script'); el.src=src; el.async=true; el.crossOrigin='anonymous'; el.dataset.externalSrc=src;
    el.onload=resolve; el.onerror=()=>reject(new Error(`Could not load ${src}`)); document.head.appendChild(el);
  });
}

let imglyRemovalPromise=null;
async function getImglyRemoval(){
  if(!imglyRemovalPromise){
    imglyRemovalPromise=import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm').then(m=>m.removeBackground||m.default);
  }
  const fn=await imglyRemovalPromise;
  if(typeof fn!=='function') throw new Error('Free browser background-removal engine could not be loaded.');
  return fn;
}

async function rasterizeSvgForRemoval(file){
  const svgText=await file.text();
  const blob=new Blob([svgText],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Could not read the SVG file.'));img.src=url;});
    const max=2048, scale=Math.min(1,max/Math.max(img.naturalWidth||1024,img.naturalHeight||1024));
    const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round((img.naturalWidth||1024)*scale)); canvas.height=Math.max(1,Math.round((img.naturalHeight||1024)*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return await new Promise(resolve=>canvas.toBlob(resolve,'image/png',0.98));
  } finally { URL.revokeObjectURL(url); }
}

function transparentPngAsSvg(blobUrl,width=1024,height=1024){
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><image href="${blobUrl}" width="${width}" height="${height}" preserveAspectRatio="none"/></svg>`;
}

async function removeImageBackgroundLocally(file,result){
  const removeBackground=await getImglyRemoval();
  const sourceFile=file.type==='image/svg+xml'?await rasterizeSvgForRemoval(file):file;
  result.innerHTML='<div class="notice"><b>Removing background on this device…</b><span>The free local AI model is downloading the first time only. Your image is not uploaded.</span></div>';
  const blob=await removeBackground(sourceFile,{
    model:'medium',
    device:'cpu',
    proxyToWorker:true,
    output:{format:'image/png',quality:0.95},
    progress:(key,current,total)=>{
      const el=result.querySelector('span');
      if(el && total) el.textContent=`${key.replace(/^compute:/,'').replace(/[-_]/g,' ')} — ${Math.round((current/total)*100)}%`; 
    }
  });
  const url=URL.createObjectURL(blob);
  result.innerHTML=`<img class="local-preview-img transparent-preview" src="${esc(url)}" alt="Background removed result"><div class="row"><a class="btn primary" href="${esc(url)}" download="itfmai-image-bg-removed-${Date.now()}.png">Download PNG</a><button class="btn" id="downloadBgSvg">Download SVG</button><button class="btn" id="saveBgAsset">Save to Assets</button><button class="btn" id="bgAgain">Remove Another</button></div><div class="notice"><b>SVG export</b><span>The SVG contains the transparent result as an embedded image. It is not a true vector trace.</span></div>`;
  document.querySelector('#saveBgAsset').onclick=()=>saveGeneratedData(url,'image/png','itfmai-image-bg-removed.png');
  document.querySelector('#downloadBgSvg').onclick=()=>{const svg=transparentPngAsSvg(url);const blob=new Blob([svg],{type:'image/svg+xml'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`itfmai-image-bg-removed-${Date.now()}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  document.querySelector('#bgAgain').onclick=()=>{state.files=[];renderFiles('bgFiles');result.innerHTML='<div class="empty"><b>Upload another image.</b></div>'};
  return url;
}

let selfieSegPromise=null;
async function getSelfieSegmentation(){
  if(!selfieSegPromise){
    selfieSegPromise=(async()=>{
      await loadExternalScript('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
      if(!window.SelfieSegmentation) throw new Error('Free video segmentation engine could not be loaded.');
      return window.SelfieSegmentation;
    })();
  }
  return selfieSegPromise;
}

async function removeVideoBackgroundLocally(file,result){
  if(!window.MediaRecorder) throw new Error('This browser does not support local video export. Try Chrome/Edge on Android or desktop.');
  if(!HTMLCanvasElement.prototype.captureStream) throw new Error('This browser does not support canvas video export.');
  const SelfieSegmentation=await getSelfieSegmentation();
  result.innerHTML='<div class="notice"><b>Preparing free local video background removal…</b><span>The video stays on this device. Processing is real-time and may take about the video duration.</span></div>';
  const sourceUrl=URL.createObjectURL(file);
  const video=document.createElement('video'); video.src=sourceUrl; video.muted=true; video.playsInline=true; video.preload='auto';
  await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('Could not read the selected video.'));});
  const maxW=1280, scale=Math.min(1,maxW/video.videoWidth), width=Math.max(2,Math.round(video.videoWidth*scale)), height=Math.max(2,Math.round(video.videoHeight*scale));
  const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
  const ctx=canvas.getContext('2d',{willReadFrequently:false});
  const Selfie=SelfieSegmentation;
  const segmenter=new Selfie({locateFile:(name)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${name}`});
  segmenter.setOptions({modelSelection:1});
  let latestMask=null, recording=false, stopped=false;
  segmenter.onResults((r)=>{
    ctx.clearRect(0,0,width,height);
    ctx.drawImage(r.image,0,0,width,height);
    ctx.globalCompositeOperation='destination-in';
    ctx.drawImage(r.segmentationMask,0,0,width,height);
    ctx.globalCompositeOperation='source-over';
    latestMask=true;
  });
  const stream=canvas.captureStream(30);
  try{video.captureStream().getAudioTracks().forEach(track=>stream.addTrack(track));}catch{}
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime) throw new Error('This browser cannot export WebM video.');
  const chunks=[]; const recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(new Error('Video recording failed.'))});
  const processFrame=async()=>{
    if(stopped || video.ended) return;
    try{await segmenter.send({image:video});}catch(e){stopped=true;try{recorder.stop()}catch{};throw e;}
    const p=result.querySelector('#videoLocalProgress'); if(p && video.duration) p.textContent=`${Math.min(100,Math.round((video.currentTime/video.duration)*100))}%`;
    if(video.requestVideoFrameCallback) video.requestVideoFrameCallback(()=>processFrame()); else requestAnimationFrame(processFrame);
  };
  result.innerHTML=`<div class="notice"><b>Removing video background locally…</b><span>Progress: <strong id="videoLocalProgress">0%</strong>. Do not close this page.</span></div><video class="local-preview-media" src="${esc(sourceUrl)}" controls muted playsinline></video>`;
  recorder.start(250); recording=true;
  video.onended=()=>{stopped=true;if(recording){recording=false;try{recorder.stop()}catch{}}};
  await video.play();
  await processFrame();
  await done;
  segmenter.close?.();
  stream.getTracks().forEach(t=>t.stop());
  URL.revokeObjectURL(sourceUrl);
  const blob=new Blob(chunks,{type:mime});

async function exportSilentVideoLocally(file,result){

  await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('Could not read the selected video.'));});
  const scale=Math.min(1,1280/(video.videoWidth||1280));
  const canvas=document.createElement('canvas'); canvas.width=Math.max(2,Math.round((video.videoWidth||1280)*scale)); canvas.height=Math.max(2,Math.round((video.videoHeight||720)*scale));
  const ctx=canvas.getContext('2d'); const stream=canvas.captureStream(30);

  video.onended=()=>{try{rec.stop()}catch{}};
  rec.start(250); await video.play(); await done; stream.getTracks().forEach(t=>t.stop()); URL.revokeObjectURL(src);
  const blob=new Blob(chunks,{type:mime}); if(!blob.size) throw new Error('No silent video was produced.');

function encodeWavFromStereo(left,right,sampleRate){
  const n=left.length, out=new ArrayBuffer(44+n*2), view=new DataView(out);
  const put=(o,str)=>{for(let i=0;i<str.length;i++)view.setUint8(o+i,str.charCodeAt(i))};
  put(0,'RIFF'); view.setUint32(4,36+n*2,true); put(8,'WAVE'); put(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); put(36,'data'); view.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,(left[i]-right[i])));view.setInt16(44+i*2,Math.round(v*32767),true)}
  return new Blob([out],{type:'audio/wav'});
}

function route(idv){state.page=idv;location.hash=idv;const v=document.querySelector('#view');if(!v)return;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===idv));closeMenu();if(idv==='free-domain')freeDomainPage(v);else if(idv==='dashboard')dashboard(v);else if(idv==='settings')apiSettings(v);else if(idv==='projects')projects(v);else if(idv==='assets')assets(v);else if(idv==='history')history(v);else if(idv==='movies'||idv==='downloader')renderEmbeddedPage(v,idv);else{const t=tools.find(x=>x[0]===idv);if(t){if(t[0]==='image-bg-remover'||t[0]==='video-bg-remover')backgroundRemover(v,t);else if(t[0]==='karaoke-remover')karaokeRemover(v);else if(t[0]==='audio-remover')audioRemover(v);else studio(v,t)}else dashboard(v)}}
function renderApp(){let initialTheme='light';try{const savedTheme=localStorage.getItem(THEME);if(savedTheme==='light'||savedTheme==='dark')initialTheme=savedTheme}catch{}document.documentElement.dataset.theme=initialTheme;root.innerHTML=shell();bindTheme();document.querySelector('#hamb').onclick=()=>{const side=document.querySelector('#side'),overlay=document.querySelector('#overlay');const opened=side.classList.toggle('open');overlay.classList.toggle('show',opened);document.querySelector('#hamb').setAttribute('aria-expanded',String(opened));document.querySelector('#hamb').setAttribute('aria-label',opened?'Close navigation':'Open navigation')};document.querySelector('#overlay').onclick=closeMenu;document.querySelector('#sidebarToggle').onclick=()=>{if(window.matchMedia('(min-width: 821px)').matches){const collapsed=document.querySelector('.layout').classList.toggle('sidebar-collapsed');document.querySelector('#sidebarToggle').setAttribute('aria-expanded',String(!collapsed));document.querySelector('#sidebarToggle').setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');return}const side=document.querySelector('#side'),overlay=document.querySelector('#overlay');const opened=side.classList.toggle('open');overlay.classList.toggle('show',opened);document.querySelector('#hamb').setAttribute('aria-expanded',String(opened));document.querySelector('#hamb').setAttribute('aria-label',opened?'Close navigation':'Open navigation')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>route(b.dataset.nav));const homeBrand=document.querySelector('.brand');if(homeBrand){homeBrand.style.cursor='pointer';homeBrand.onclick=()=>route('dashboard');homeBrand.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();route('dashboard')}}}const mobileHome=document.querySelector('.mobile-brand');if(mobileHome){mobileHome.style.cursor='pointer';mobileHome.onclick=()=>route('dashboard')}route(state.page)}
window.addEventListener('hashchange',()=>{state.page=(location.hash||'#dashboard').slice(1);route(state.page)});renderApp();route(state.page);

})();

  </script>
