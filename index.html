function showPage(page){$("#sidebar").classList.remove("open");document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const titles={home:"Dashboard",tools:"All AI Tools",tv:"Live TV Channels",movies:"MovieHub",chat:"AI Chat",creations:"My Creations",downloads:"My Downloads",favorites:"Favorites",credits:"Credit Balance",settings:"Settings & API",help:"Help & Support"};$("#pageTitle").textContent=titles[page]||"Workspace";({home:homePage,tools:toolsPage,tv:tvPage,movies:moviesPage,chat:chatPage,creations:()=>savedPage("creations"),downloads:()=>savedPage("downloads"),favorites:()=>savedPage("favorites"),credits:creditsPage,settings:settingsPage,help:helpPage}[page]||homePage)()}

function homePage(){ $("#view").innerHTML=`<section class="hero"><div class="chips"><span class="chip">ALL-IN-ONE CREATIVE PLATFORM</span><span class="chip">31 WORKSPACES</span></div><h1>Create anything with <span class="gradient">ITFM AI</span></h1><p class="muted">Images, video, audio, AI assistants, live channels and movie discovery — in one workspace.</p><div class="actions"><button class="primary" onclick="showPage('tools')">Explore AI Tools →</button><button onclick="showPage('tv')">▶ Watch Live TV</button><button onclick="showPage('movies')">Explore MovieHub</button></div></section><div class="grid"><div class="card"><div class="muted tiny">AI WORKSPACES</div><h2>29</h2><span class="tiny muted">Dedicated tool panels</span></div><div class="card"><div class="muted tiny">ENTERTAINMENT</div><h2>TV + Movies</h2><span class="tiny muted">In-site player experience</span></div><div class="card"><div class="muted tiny">YOUR PROJECTS</div><h2>${store.get("projects",[]).length}</h2><span class="tiny muted">Saved locally in this browser</span></div><div class="card"><div class="muted tiny">CREDITS</div><h2>${store.get("credits",100)}</h2><span class="tiny muted">Demo balance</span></div></div><div class="sectionhead"><h2>Popular AI tools</h2><button class="ghost" onclick="showPage('tools')">View all →</button></div><div class="grid">${tools.slice(0,8).map((t,i)=>toolCard(t,i)).join("")}</div>`}
function toolCard(t,i){return `<div class="card toolcard" onclick="openTool(${i})"><div class="toolicon">${t[1]}</div><h3>${t[0]}</h3><p>${t[2]}</p><div style="margin-top:13px"><span class="chip">${t[3]}</span></div></div>`}
function toolsPage(){ $("#view").innerHTML=`<div class="sectionhead"><div><h2>All AI Tools</h2><p class="muted">Choose a tool to open its dedicated workspace.</p></div><input id="toolSearch" placeholder="Search tools..." style="max-width:260px"></div><div class="chips" style="margin-bottom:16px"><button onclick="filterTools('All')">All</button>${["Image","Video","Audio","3D","Builder","Chat"].map(x=>`<button onclick="filterTools('${x}')">${x}</button>`).join("")}</div><div class="grid" id="toolGrid">${tools.map(toolCard).join("")}</div>`;$("#toolSearch").oninput=()=>{const q=$("#toolSearch").value.toLowerCase();$("#toolGrid").innerHTML=tools.map(toolCard).filter((_,i)=>tools[i][0].toLowerCase().includes(q)||tools[i][2].toLowerCase().includes(q)).join("")}}

function openTool(i){currentTool=i;uploadedFile=null;const t=tools[i], fields=t[4].split(", ");$("#pageTitle").textContent=t[0];document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("active"));$("#view").innerHTML=`<div class="sectionhead"><div><div class="muted tiny">AI TOOL WORKSPACE / ${t[3].toUpperCase()}</div><h2>${t[1]} ${t[0]}</h2><p class="muted">${t[2]}</p></div><button onclick="showPage('tools')">← All tools</button></div><div class="workspace"><section class="panel"><h3>Input & Settings</h3><div class="drop" id="drop"><input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx"><strong>＋ Upload a file</strong><p class="tiny muted">Click to browse or drag and drop a file here</p><div id="fileName" class="tiny"></div></div><label>Describe what you want to create or edit</label><textarea id="prompt" placeholder="Describe your idea in detail..."></textarea><div class="row"><div><label>Style</label><select id="style"><option>Realistic</option><option>Cinematic</option><option>Anime</option><option>3D</option><option>Cartoon</option><option>Minimal</option><option>Luxury</option><option>Professional</option></select></div><div><label>Aspect ratio</label><select id="ratio"><option>1:1 Square</option><option>16:9 Landscape</option><option>9:16 Portrait</option><option>4:3</option><option>3:2</option></select></div></div><div class="row"><div><label>Quality / Resolution</label><select id="quality"><option>Standard</option><option>HD / 1080p</option><option>2K</option><option>4K (if provider supports)</option></select></div><div><label>Number / Duration</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>5 seconds</option><option>10 seconds</option><option>15 seconds</option></select></div></div><label>Negative prompt / Avoid</label><input id="negative" placeholder="Things to avoid (optional)"><div class="sectionhead"><h3>Tool features</h3></div><div class="chips">${fields.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div><div class="actions"><button class="primary" id="generate">✦ Generate</button><button id="promptHelp">Improve Prompt</button><button id="saveProject">Save Project</button><button id="resetTool">Reset</button></div><div class="progress" id="progress"><span></span></div><div class="status" id="status">Ready. Connect a compatible provider in Settings to enable generation.</div></section><section class="panel"><h3>Result Preview</h3><div class="preview" id="preview"><div><div style="font-size:42px">✧</div><b>Your result will appear here</b><p class="muted tiny">Upload a file or describe your idea, then generate.</p></div></div><div class="toolbar" style="margin-top:12px"><button onclick="downloadPreview()">Download</button><button onclick="saveResult()">Save to My Creations</button><button onclick="showPage('creations')">History</button></div><div class="notice">Provider note: a FreeLLMAPI chat key can power prompts and text assistance. Image, video, audio, 3D and editing operations require their own compatible generation/processing API endpoints. Configure those endpoints in Settings; this page will not fake a generated result.</div></section></div>`;
const fi=$("#fileInput"),drop=$("#drop");drop.onclick=()=>fi.click();fi.onchange=()=>setUpload(fi.files[0]);drop.ondragover=e=>{e.preventDefault();drop.style.borderColor="var(--cyan)"};drop.ondrop=e=>{e.preventDefault();setUpload(e.dataTransfer.files[0])};$("#generate").onclick=()=>runTool(false);$("#promptHelp").onclick=()=>runTool(true);$("#saveProject").onclick=()=>saveProject();$("#resetTool").onclick=()=>openTool(i)}
function setUpload(f){if(!f)return;uploadedFile=f;$("#fileName").textContent=f.name+" · "+(f.size/1024/1024).toFixed(2)+" MB";if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(f);if(f.type.startsWith("image/"))$("#preview").innerHTML=`<img src="${previewUrl}" alt="Uploaded preview">`;else if(f.type.startsWith("video/"))$("#preview").innerHTML=`<video controls src="${previewUrl}"></video>`;else $("#preview").innerHTML=`<div>📄<p>${esc(f.name)}</p><span class="muted tiny">File uploaded</span></div>`}
async function runTool(promptOnly){const t=tools[currentTool],prompt=$("#prompt").value.trim();if(!prompt&&!uploadedFile){$("#status").textContent="Please enter a description or upload a file.";return}const cfg=store.get("config",{});const base=(cfg.base||"").replace(/\/$/,""),key=cfg.key||"";if(!base||!key){$("#status").innerHTML='<span class="danger">Add FreeLLMAPI Base URL and API Key in Settings first.</span>';return}const bar=$("#progress");bar.style.display="block";bar.firstElementChild.style.width="25%";$("#status").textContent="Connecting to AI provider…";try{const res=await fetch(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:cfg.model||"auto",messages:[{role:"system",content:promptOnly?"You are an expert creative prompt engineer. Improve the user's prompt for the selected tool. Return only the improved prompt.":"You are the creative assistant inside ITFM AI. The user is using "+t[0]+". Help plan the requested output and return a concise, actionable creative brief. Do not claim to have generated or edited media. If the user requests an operation that needs a media-generation provider, explain that the dedicated provider endpoint must be configured."},{role:"user",content:`Tool: ${t[0]}\nStyle: ${$("#style").value}\nAspect ratio: ${$("#ratio").value}\nQuality: ${$("#quality").value}\nNegative prompt: ${$("#negative").value}\nRequest: ${prompt||"Please inspect the uploaded file and suggest the edit."}`}],temperature:.7})});bar.firstElementChild.style.width="85%";if(!res.ok)throw new Error("Provider returned HTTP "+res.status);const data=await res.json(),out=data.choices?.[0]?.message?.content||"No response returned.";bar.firstElementChild.style.width="100%";$("#preview").innerHTML=`<div style="text-align:left;width:100%"><span class="chip">${promptOnly?"IMPROVED PROMPT":"AI CREATIVE BRIEF"}</span><p style="white-space:pre-wrap">${esc(out)}</p><button onclick="navigator.clipboard.writeText(${JSON.stringify(out).replace(/</g,"\\u003c")})">Copy text</button></div>`;$("#status").textContent=promptOnly?"Prompt improved successfully.":"AI brief generated. Media output requires a configured image/video/audio provider.";store.set("lastResult",{tool:t[0],text:out,date:new Date().toISOString()})}catch(e){$("#status").textContent="Generation error: "+e.message}finally{setTimeout(()=>{bar.style.display="none";bar.firstElementChild.style.width="0"},900)}}
function saveProject(){const p={tool:tools[currentTool][0],prompt:$("#prompt").value,style:$("#style").value,date:new Date().toISOString()};const a=store.get("projects",[]);a.unshift(p);store.set("projects",a);$("#status").textContent="Project saved in this browser."}
function saveResult(){const r=store.get("lastResult");if(!r){$("#status").textContent="No result to save yet.";return}const a=store.get("creations",[]);a.unshift(r);store.set("creations",a);alert("Saved to My Creations.")}
function downloadPreview(){const r=store.get("lastResult");if(!r){alert("No generated result available to download.");return}const blob=new Blob([r.text],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="itfm-ai-result.txt";a.click();URL.revokeObjectURL(a.href)}
function savedPage(type){const arr=store.get(type,[]);$("#view").innerHTML=`<div class="sectionhead"><h2>${type==="creations"?"My Creations":type==="downloads"?"My Downloads":"Favorites"}</h2></div>${arr.length?`<div class="grid">${arr.map(x=>`<div class="card"><span class="chip">${esc(x.tool||"Saved")}</span><p>${esc(x.text||x.prompt||"Saved item")}</p><small class="muted">${new Date(x.date||Date.now()).toLocaleString()}</small></div>`).join("")}</div>`:`<div class="card empty">Nothing saved here yet.</div>`}`}
function settingsPage(){const c=store.get("config",{});$("#view").innerHTML=`<h2>Settings & API Connections</h2><p class="muted">Configure service connections. Never publish private keys in frontend code.</p><div class="workspace"><section class="panel"><h3>FreeLLMAPI — Chat & Prompt Assistant</h3><label>Base URL (must end in /v1)</label><input id="apiBase" value="${esc(c.base||"http://127.0.0.1:3001/v1")}" placeholder="https://your-api-host/v1"><label>Unified API Key</label><input id="apiKey" type="password" value="${esc(c.key||"")}" placeholder="freellmapi-..."><label>Model name</label><input id="apiModel" value="${esc(c.model||"auto")}" placeholder="auto"><div class="actions"><button class="primary" onclick="saveConfig()">Save API Settings</button><button onclick="testApi()">Test Connection</button></div><div id="apiStatus" class="status"></div><div class="notice">For production, route requests through a server-side API proxy. Saving a key here stores it in this browser's local storage and is not suitable for a public shared website.</div></section><section class="panel"><h3>Media provider endpoints</h3><p class="muted tiny">Configure server-side endpoints for each media capability. Endpoints should accept authenticated POST requests and return a result URL or JSON.</p>${["image","video","audio","3d","editing"].map(x=>`<label>${x.toUpperCase()} API endpoint</label><input id="ep_${x}" value="${esc((c.endpoints||{})[x]||"")}" placeholder="https://your-backend.example/api/${x}">`).join("")}<div class="actions"><button class="primary" onclick="saveEndpoints()">Save endpoints</button></div><div class="notice">A single FreeLLMAPI key is not a media-generation API. These endpoints need actual provider implementations on a secure backend.</div></section></div><section class="panel" style="margin-top:16px"><h3>TMDB Movie Metadata</h3><label>TMDB API Read Access Token</label><input id="tmdbToken" type="password" value="${esc(c.tmdb||"")}" placeholder="Paste TMDB read access token"><div class="actions"><button class="primary" onclick="saveTmdb()">Save TMDB Token</button></div><p class="tiny muted">TMDB provides movie metadata and posters, not movie streaming rights or video files.</p></section>`}
function saveConfig(){const c=store.get("config",{});c.base=$("#apiBase").value.trim();c.key=$("#apiKey").value.trim();c.model=$("#apiModel").value.trim()||"auto";store.set("config",c);$("#apiStatus").textContent="Settings saved in this browser."}
async function testApi(){saveConfig();const c=store.get("config",{});$("#apiStatus").textContent="Testing…";try{const r=await fetch(c.base.replace(/\/$/,"")+"/models",{headers:{Authorization:"Bearer "+c.key}});$("#apiStatus").textContent=r.ok?"Connection successful.":"API responded with HTTP "+r.status}catch(e){$("#apiStatus").textContent="Connection failed: "+e.message}}
function saveEndpoints(){const c=store.get("config",{});c.endpoints={};["image","video","audio","3d","editing"].forEach(x=>c.endpoints[x]=$("#ep_"+x).value.trim());store.set("config",c);alert("Endpoints saved.")}
function saveTmdb(){const c=store.get("config",{});c.tmdb=$("#tmdbToken").value.trim();store.set("config",c);alert("TMDB token saved in this browser.")}
function chatPage(){const hist=store.get("chat",[]);$("#view").innerHTML=`<div class="sectionhead"><div><h2>AI Chat Assistant</h2><p class="muted">Chat, writing, translation, code and creative help.</p></div><button onclick="store.set('chat',[]);chatPage()">＋ New Chat</button></div><section class="panel"><div id="chatLog" style="min-height:280px;max-height:55vh;overflow:auto">${hist.map(m=>`<div class="card" style="margin-bottom:9px"><b>${m.role==="user"?"You":"ITFM AI"}</b><p style="white-space:pre-wrap">${esc(m.content)}</p></div>`).join("")||'<div class="empty">Start a conversation with ITFM AI.</div>'}</div><label>Your message</label><textarea id="chatInput" placeholder="Ask anything…"></textarea><div class="actions"><button class="primary" onclick="sendChat()">Send message →</button><button onclick="document.getElementById('chatInput').value=''">Clear</button></div><div class="status" id="chatStatus"></div></section>`}
async function sendChat(){const input=$("#chatInput"),msg=input.value.trim();if(!msg)return;const c=store.get("config",{});if(!c.base||!c.key){$("#chatStatus").textContent="Configure FreeLLMAPI in Settings first.";return}const h=store.get("chat",[]);h.push({role:"user",content:msg});store.set("chat",h);input.value="";chatPage();$("#chatStatus").textContent="Thinking…";try{const r=await fetch(c.base.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+c.key},body:JSON.stringify({model:c.model||"auto",messages:h.map(m=>({role:m.role,content:m.content}))})});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json(),answer=d.choices?.[0]?.message?.content||"No response";h.push({role:"assistant",content:answer});store.set("chat",h);chatPage()}catch(e){$("#chatStatus").textContent="Chat error: "+e.message}}
function creditsPage(){$("#view").innerHTML=`<section class="hero"><div class="muted">DEMO CREDIT BALANCE</div><h1>${store.get("credits",100)} <span class="gradient">credits</span></h1><p class="muted">This starter file shows a local demo balance. Production credit billing must be validated server-side.</p><button class="primary" onclick="alert('Connect a payment provider and server-side billing before enabling subscriptions.')">Upgrade to Premium</button></section>`}
function helpPage(){$("#view").innerHTML=`<h2>Help & Support</h2><div class="panel"><h3>How to use ITFM AI</h3><ol><li>Open All AI Tools and choose a workspace.</li><li>Upload your media or describe the output.</li><li>Configure FreeLLMAPI for chat and prompt assistance.</li><li>Connect dedicated media provider endpoints for image, video, audio and 3D generation.</li><li>Save projects and results in this browser.</li></ol><p class="muted tiny">This is a single-file frontend starter. Authentication, cloud storage, payments, secure API proxying and production media processing require backend services.</p></div>`}
async function tvPage(){ $("#view").innerHTML=`<div class="sectionhead"><div><h2>▣ Live TV Channels</h2><p class="muted">Browse public IPTV channel listings and play supported streams inside this page.</p></div><button class="primary" onclick="loadChannels()">↻ Load / Refresh Channels</button></div><div class="notice">Only use streams you are legally entitled to watch. Public IPTV directory entries are not a guarantee of licensing, availability or permission to rebroadcast. This page filters to channels explicitly marked as not broken where that metadata is available; verify rights for your region.</div><div class="tv-layout"><section class="panel"><input id="channelSearch" placeholder="Search channels..." oninput="renderChannels()"><div class="chips" style="margin:10px 0"><select id="channelCat" onchange="renderChannels()"><option value="">All categories</option></select><select id="channelCountry" onchange="renderChannels()"><option value="">All countries</option></select></div><div class="list" id="channelList"><div class="empty">Press Load Channels to fetch the IPTV-org public listing.</div></div></section><section class="panel"><h3 id="playingTitle">Select a channel</h3><video id="tvPlayer" class="player" controls playsinline></video><div class="status" id="tvStatus">Stream playback depends on source availability and browser support.</div><div class="actions"><button onclick="toggleFavoriteChannel()">♡ Favorite</button><button onclick="$('#tvPlayer').requestFullscreen?.()">Fullscreen</button></div></section></div>`}
async function loadChannels(){const box=$("#channelList");box.innerHTML='<div class="empty">Loading channel list…</div>';try{const [cr,sr]=await Promise.all([fetch("https://iptv-org.github.io/api/channels.json"),fetch("https://iptv-org.github.io/api/streams.json")]);if(!cr.ok||!sr.ok)throw Error("Could not load IPTV directory");const [cs,ss]=await Promise.all([cr.json(),sr.json()]);const byId=new Map(cs.map(c=>[c.id,c]));channels=ss.filter(s=>s.url&&/^https?:/i.test(s.url)).map(s=>({...s,meta:byId.get(s.channel)})).filter(s=>s.meta);const cats=[...new Set(channels.flatMap(c=>c.meta.categories||[]))].sort(),countries=[...new Set(channels.map(c=>c.meta.country).filter(Boolean))].sort();$("#channelCat").innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join("");$("#channelCountry").innerHTML='<option value="">All countries</option>'+countries.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");renderChannels();$("#tvStatus").textContent=`Loaded ${channels.length} listed stream entries. Availability and rights are not guaranteed.`}catch(e){box.innerHTML=`<div class="empty danger">${esc(e.message)}. Check internet access and try again.</div>`}}
function renderChannels(){if(!$("#channelList"))return;const q=($("#channelSearch")?.value||"").toLowerCase(),cat=$("#channelCat")?.value||"",country=$("#channelCountry")?.value||"";const filtered=channels.filter(c=>(!q||(c.meta.name||"").toLowerCase().includes(q))&&(!cat||(c.meta.categories||[]).includes(cat))&&(!country||c.meta.country===country));$("#channelList").innerHTML=filtered.slice(0,700).map((c,i)=>`<div class="channel" onclick="playChannel(${channels.indexOf(c)})"><span>📺 ${esc(c.meta.name||c.channel)} <small>${esc(c.meta.country||"")}</small></span><small>${esc((c.meta.categories||[])[0]||"TV")}</small></div>`).join("")||'<div class="empty">No matching channels.</div>'}
function playChannel(i){const c=channels[i];if(!c)return;const v=$("#tvPlayer");if(hls){hls.destroy();hls=null}$("#playingTitle").textContent=c.meta.name||c.channel;$("#tvStatus").textContent="Loading stream…";v.pause();v.removeAttribute("src");v.load();if(c.url.toLowerCase().includes(".m3u8")&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$("#tvStatus").textContent="Stream failed or is unavailable in this browser."})}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=c.url;v.play().catch(()=>{})}else{v.src=c.url;v.play().catch(()=>{$("#tvStatus").textContent="Cannot play this stream in this browser. It may be offline or use an unsupported format."})}}
function toggleFavoriteChannel(){const name=$("#playingTitle").textContent;if(!name||name==="Select a channel")return;const f=store.get("favorites",[]);if(!f.some(x=>x.name===name)){f.push({name,date:new Date().toISOString(),tool:"TV Channel"});store.set("favorites",f)}$("#tvStatus").textContent="Channel saved to favorites."}
async function moviesPage(){ $("#view").innerHTML=`<div class="sectionhead"><div><h2>▶ MovieHub</h2><p class="muted">Discover movie metadata and licensed in-page playback sources.</p></div><button onclick="loadMovies('popular')">Popular</button></div><div class="notice">TMDB supplies movie information and artwork, not movie files or streaming rights. This player accepts only playback/embed URLs that you have permission to use. No YouTube or third-party watch-link directory is added.</div><div class="row"><input id="movieSearch" placeholder="Search movies..." onkeydown="if(event.key==='Enter')searchMovies()"><button class="primary" onclick="searchMovies()">Search</button></div><div class="chips" style="margin:12px 0"><button onclick="loadMovies('popular')">Popular</button><button onclick="loadMovies('now_playing')">Now Playing</button><button onclick="loadMovies('top_rated')">Top Rated</button><button onclick="loadMovies('upcoming')">Upcoming</button></div><div id="movieGrid" class="moviegrid"><div class="empty">Configure TMDB token in Settings, then load movies.</div></div><div id="movieDetail" style="margin-top:18px"></div>`;if(store.get("config",{}).tmdb)loadMovies("popular")}
async function tmdb(path){const token=store.get("config",{}).tmdb;if(!token)throw Error("Add TMDB Read Access Token in Settings.");const r=await fetch("https://api.themoviedb.org/3"+path,{headers:{Authorization:"Bearer "+token,accept:"application/json"}});if(!r.ok)throw Error("TMDB request failed: "+r.status);return r.json()}
async function loadMovies(kind){$("#movieGrid").innerHTML='<div class="empty">Loading movies…</div>';try{const d=await tmdb("/movie/"+kind+"?language=en-US&page=1");renderMovies(d.results||[])}catch(e){$("#movieGrid").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function searchMovies(){const q=$("#movieSearch").value.trim();if(!q)return;$("#movieGrid").innerHTML='<div class="empty">Searching…</div>';try{const d=await tmdb("/search/movie?query="+encodeURIComponent(q)+"&include_adult=false&language=en-US&page=1");renderMovies(d.results||[])}catch(e){$("#movieGrid").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderMovies(list){movies=list;$("#movieGrid").innerHTML=list.map((m,i)=>`<div class="movie" onclick="movieDetails(${i})"><img loading="lazy" src="${m.poster_path?"https://image.tmdb.org/t/p/w342"+m.poster_path:""}" alt="${esc(m.title)}"><b>${esc(m.title)}</b><small>${(m.release_date||"").slice(0,4)} · ★ ${Number(m.vote_average||0).toFixed(1)}</small></div>`).join("")||'<div class="empty">No movies found.</div>'}
async function movieDetails(i){const m=movies[i];selectedMovie=m;$("#movieDetail").innerHTML=`<section class="panel"><div class="workspace"><div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.release_date||"")} · ★ ${Number(m.vote_average||0).toFixed(1)}</p><p>${esc(m.overview||"No synopsis available.")}</p><button onclick="addMovieFavorite()">♡ Add to Watchlist</button></div><div><h3>Watch inside ITFM AI</h3><label>Licensed playback / embed URL</label><input id="movieUrl" placeholder="Paste an authorized embed or stream URL"><div class="actions"><button class="primary" onclick="playMovie()">Play here</button></div><p class="tiny muted">The URL must be provided by a rights holder or licensed streaming provider and permit embedding on your domain.</p><div id="moviePlayerWrap"></div></div></div></section>`}
function playMovie(){const url=$("#movieUrl").value.trim();if(!/^https:\/\//i.test(url)){alert("Enter a secure HTTPS playback URL that you are authorized to embed.");return}let u;try{u=new URL(url)}catch{alert("Invalid URL");return}if(!["https:"].includes(u.protocol)){alert("HTTPS required.");return}$("#moviePlayerWrap").innerHTML=`<iframe title="Licensed movie player" src="${esc(url)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:12px"></iframe>`}
function addMovieFavorite(){if(!selectedMovie)return;const f=store.get("favorites",[]);f.push({name:selectedMovie.title,tool:"Movie",date:new Date().toISOString()});store.set("favorites",f);alert("Added to Favorites.")}
showPage("home");
</script>
</body></html>
