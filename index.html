function pageTools(){return `<h1 class="page-title">All AI Tools</h1><p class="page-desc">Explore all 31 tools across image, video, audio, avatar, animation, app and entertainment.</p><div class="section-head"><div><h2>Tool library</h2><p>Select a category or search by name.</p></div><input class="search" id="toolSearch" placeholder="Search 31 tools…"></div><div class="filters" id="filters">${[['all','All tools'],['image','Image'],['video','Video'],['avatar','Avatar'],['animation','Animation & 3D'],['audio','Audio'],['app','App & Web'],['entertainment','Entertainment']].map((x,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="grid" id="toolGrid">${toolCards()}</div>`}
function pageStudio(kind){const list=toolsList.filter(t=>t[2]===kind);return `<h1 class="page-title">${kind==='image'?'Image':kind==='video'?'Video':kind==='audio'?'Audio':kind==='avatar'?'Avatar':'Animation'} Studio</h1><p class="page-desc">${descriptions[kind==='image'?'images':kind==='video'?'videos':kind==='audio'?'audio':kind==='avatar'?'avatars':'animation']}</p><div class="grid">${list.map(card).join('')}</div>`}
function pageProjects(type){let arr=type==='favorites'?projects.filter(p=>favorites.includes(p.toolId)):type==='downloads'?downloads:projects;return `<h1 class="page-title">${type==='favorites'?'Favorites':type==='downloads'?'Download History':'My Projects'}</h1><p class="page-desc">Your work is stored locally in this browser for this demo.</p>${arr.length?`<div class="list">${arr.slice().reverse().map(p=>`<div class="listitem"><div><b>${esc(p.name||'Untitled project')}</b><small>${esc(p.tool||'ITFM AI')} · ${esc(p.date||'')}</small></div><span class="tag">${esc(p.kind||'Project')}</span></div>`).join('')}</div>`:'<div class="empty"><b>Nothing here yet</b>Your saved projects and downloads will appear here.</div>'}`}
function pageTool(t){let upload=t[2]==='image'||t[2]==='avatar'||t[2]==='video'||t[2]==='audio';let accept=t[2]==='image'||t[2]==='avatar'?'image/*':t[2]==='video'?'video/*':t[2]==='audio'?'audio/*':'*/*';return `<h1 class="page-title">${t[1]}</h1><p class="page-desc">${t[4]}</p><div class="tool-layout"><section class="panel"><h3>Studio controls</h3><p class="muted">Configure your project and preview your input.</p><div class="field"><label>Project name</label><input id="projectName" value="${t[1]} project" maxlength="80"></div><div class="field"><label>Describe what you want to create</label><textarea id="prompt" placeholder="Describe your idea, style, mood, details…"></textarea></div>${upload?`<div class="field"><label>Upload a source file (optional)</label><div class="drop">Drop a file here or select from your device<input type="file" id="upload" accept="${accept}"></div></div>`:''}<div class="row"><div class="field"><label>Style / preset</label><select id="style"><option>Modern</option><option>Realistic</option><option>Cinematic</option><option>Minimal</option><option>Anime</option><option>3D</option><option>Professional</option><option>Creative</option></select></div><div class="field"><label>Output quality</label><select id="quality"><option>HD</option><option>Standard</option><option>4K (provider required)</option></select></div></div><div class="row"><div class="field"><label>Aspect ratio</label><select id="ratio"><option>1:1 Square</option><option>16:9 Landscape</option><option>9:16 Portrait</option><option>4:5 Social</option></select></div><div class="field"><label>Number of variations</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div><button class="btn" id="saveProject">Save project setup</button> <button class="btn secondary" id="resetTool">Reset</button><div class="notice">This page is a working front-end prototype. Real AI generation, editing, voice/video processing and cloud exports require connecting an AI/API provider and a secure backend.</div></section><aside class="panel"><h3>Preview</h3><p class="muted">Your uploaded file or project preview will appear here.</p><div class="preview" id="preview">No preview yet<br><small>Upload a file or save your project setup.</small></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn secondary" id="previewBtn">Preview input</button><button class="btn secondary" id="downloadSetup">Download brief</button></div><p class="muted" style="margin-top:13px">Tool: ${t[1]} · Category: ${groups[t[2]]}</p></aside></div>`}
function pageChat(){return `<h1 class="page-title">AI Chat</h1><p class="page-desc">A simple chat interface layout, ready to connect to your chosen AI model.</p><section class="panel"><div class="list" id="chatlog"><div class="listitem"><div><b>ITFM AI Assistant</b><small>Hello! Describe what you want help with. Connect an AI API to enable live responses.</small></div></div></div><div class="field"><label>Your message</label><textarea id="chatInput" placeholder="Ask a question, draft content, or describe a task…"></textarea></div><button class="btn" id="sendChat">Send message</button><p class="notice">Live model responses need a backend API key. Never place secret API keys in this public HTML file.</p></section>`}
function builderPage(app){return `<h1 class="page-title">${app?'AI Mini-App Builder':'AI Mini-Website Builder'}</h1><p class="page-desc">Turn an idea into a structured build brief.</p><div class="tool-layout"><section class="panel"><div class="field"><label>${app?'App':'Website'} name</label><input id="buildName" placeholder="My ${app?'app':'website'}"></div><div class="field"><label>Describe your idea</label><textarea id="buildPrompt" placeholder="What should it do? Who is it for? What pages or features are needed?"></textarea></div><div class="row"><div class="field"><label>Project type</label><select id="buildType">${(app?['Productivity app','Community app','Booking app','Shop app','Education app']:['Landing page','Portfolio','Business website','E-commerce','Blog','Web app']).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Design style</label><select id="buildStyle"><option>Modern dark</option><option>Clean minimal</option><option>Bold colorful</option><option>Professional</option></select></div></div><button class="btn" id="makeBrief">Create build brief</button></section><section class="panel"><h3>Build brief</h3><div class="preview" id="buildPreview">Your app / website brief will appear here.</div><button class="btn secondary" style="margin-top:12px" id="saveBrief">Save project</button><p class="notice">Publishing, database, authentication and hosting require an implementation backend and provider credentials.</p></section></div>`}
function entertainmentPage(movie){return `<h1 class="page-title">${movie?'MovieHub':'TV Channels'}</h1><p class="page-desc">${movie?'Explore movie information, trailers, watchlists and legal viewing destinations.':'Browse official and licensed live television streams.'}</p><div class="panel"><div class="field"><label>Search ${movie?'movies and shows':'channels'}</label><input id="entSearch" placeholder="Search titles or categories…"></div><div class="filters">${(movie?['Malayalam','Tamil','Hindi','English','Telugu','Web Series','Trailers']:['Malayalam','Tamil','Hindi','English','News','Sports','Entertainment','Music','Kids']).map(x=>`<button class="filter" data-ent="${x}">${x}</button>`).join('')}</div><div class="empty"><b>${movie?'Your movie discovery hub starts here':'Your channel directory starts here'}</b>${movie?'Add licensed catalog metadata and official trailer / streaming links.':'Add official channel listings and authorized live stream URLs.'}<br><small>There are no media streams bundled in this demo.</small></div><div class="notice">Only use content, trailers and streams you own or are authorized to distribute. This demo does not host or provide pirated media.</div></div>`}
function pagePlans(){return `<h1 class="page-title">Subscription Plans</h1><p class="page-desc">Choose a plan structure for the future ITFM AI service.</p><div class="grid">${[['Free','₹0','Daily starter credits','Explore the dashboard and tool demos'],['Pro','₹499 / month','More AI credits','Higher limits and project history'],['Premium','₹999 / month','Priority AI credits','Advanced workflows and team features']].map((p,i)=>`<div class="card"><span class="tag">${i===0?'STARTER':i===1?'POPULAR':'ADVANCED'}</span><h2 style="margin:12px 0 3px">${p[0]}</h2><h2 style="margin:0;color:#c4b5fd">${p[1]}</h2><p>${p[2]}<br>${p[3]}</p><button data-plan="${p[0]}">Choose ${p[0]}</button></div>`).join('')}</div><div class="notice">Prices and plan names are sample placeholders, not active offers. Payment gateway, subscriptions, credit accounting and refunds require backend integration and legal business setup.</div>`}
function simplePage(p){const map={profile:['User Profile','Manage your display name and preferences.'],settings:['Settings','Configure your ITFM AI experience.'],help:['Help & Support','Find help for using the creative studio.'],admin:['Admin Dashboard','Administrative overview for the future service.']};let [title,desc]=map[p];return `<h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p><div class="panel">${p==='profile'?'<div class="field"><label>Display name</label><input value="ITFM AI Creator" id="displayName"></div><div class="field"><label>Account email</label><input placeholder="Add email after authentication is configured"></div><button class="btn" id="saveProfile">Save profile</button>':p==='settings'?'<div class="listitem"><div><b>Language</b><small>Dashboard interface language</small></div><select><option>English</option><option>മലയാളം</option></select></div><div class="listitem"><div><b>Theme</b><small>Appearance</small></div><select><option>Dark</option><option>Light (coming soon)</option></select></div><div class="notice">Account security and cloud data settings need authentication and backend services.</div>':p==='help'?'<h3>How can we help?</h3><p class="muted">Open any tool, describe your project, upload an optional source file and save a project brief. To activate AI generation, connect a provider API through a secure server.</p><div class="field"><label>Support message</label><textarea placeholder="Describe your question…"></textarea></div><button class="btn" id="supportMsg">Prepare support request</button>':'<div class="stats"><div class="stat"><strong>31</strong><span>Tool entries</span></div><div class="stat"><strong>${projects.length}</strong><span>Local projects</span></div><div class="stat"><strong>${favorites.length}</strong><span>Favorites</span></div><div class="stat"><strong>Demo</strong><span>System status</span></div></div><p class="muted">Admin permissions, users, billing and system analytics are not enabled in this front-end prototype. Secure role-based authentication is required.</p>'}</div>`}
function render(page){activePage=page;$('#crumb').textContent=({home:'Dashboard',tools:'All AI Tools',projects:'My Projects',favorites:'Favorites',downloads:'Download History',images:'Image Studio',videos:'Video Studio',audio:'Audio Studio',avatars:'Avatar Studio',animation:'Animation Studio',chat:'AI Chat',appbuilder:'App Builder',websitebuilder:'Website Builder',tv:'TV Channels',movies:'MovieHub',plans:'Subscription Plans',profile:'User Profile',settings:'Settings',help:'Help & Support',admin:'Admin Dashboard'})[page]||'Dashboard';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');let html=page==='home'?pageHome():page==='tools'?pageTools():page==='projects'||page==='favorites'||page==='downloads'?pageProjects(page):['images','videos','audio','avatars','animation'].includes(page)?pageStudio(({images:'image',videos:'video',audio:'audio',avatars:'avatar',animation:'animation'})[page]):page==='chat'?pageChat():page==='appbuilder'||page==='websitebuilder'?builderPage(page==='appbuilder'):page==='tv'||page==='movies'?entertainmentPage(page==='movies'):page==='plans'?pagePlans():simplePage(page);$('#content').innerHTML=html;bindPage()}
function bindPage(){document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=toolsList.find(x=>x[0]===+b.dataset.tool);renderTool(t)});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=+b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();toast(favorites.includes(id)?'Added to favorites':'Removed from favorites');render(activePage)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));
if($('#toolSearch')){$('#toolSearch').oninput=updateGrid;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateGrid()})}
if($('#saveProject')){$('#saveProject').onclick=saveToolProject;$('#resetTool').onclick=()=>{ $('#prompt').value='';$('#preview').innerHTML='No preview yet';$('#projectName').value='Tool project';if($('#upload'))$('#upload').value='';};$('#previewBtn').onclick=previewInput;$('#downloadSetup').onclick=downloadBrief;if($('#upload'))$('#upload').onchange=previewInput}
if($('#sendChat'))$('#sendChat').onclick=()=>{let v=$('#chatInput').value.trim();if(!v)return;let n=document.createElement('div');n.className='listitem';n.innerHTML='<div><b>You</b><small></small></div>';n.querySelector('small').textContent=v;$('#chatlog').append(n);$('#chatInput').value='';let r=document.createElement('div');r.className='listitem';let d=document.createElement('div');let b=document.createElement('b');b.textContent='ITFM AI Assistant';let s=document.createElement('small');s.textContent='This chat UI is ready. Connect a secure AI API endpoint to receive live model responses.';d.append(b,s);r.append(d);$('#chatlog').append(r)};
if($('#makeBrief'))$('#makeBrief').onclick=()=>{let name=$('#buildName').value||'Untitled build',prompt=$('#buildPrompt').value||'No description supplied';$('#buildPreview').textContent=`${name}\n${$('#buildType').value} · ${$('#buildStyle').value}\n\n${prompt}`};if($('#saveBrief'))$('#saveBrief').onclick=()=>{let name=$('#buildName').value||'Untitled build';projects.push({name,tool:activePage==='appbuilder'?'AI Mini-App Builder':'AI Mini-Website Builder',kind:'Build brief',date:new Date().toLocaleString()});save();toast('Build brief saved')};if($('#saveProfile'))$('#saveProfile').onclick=()=>toast('Profile preferences saved for this session');if($('#supportMsg'))$('#supportMsg').onclick=()=>toast('Support request draft prepared');document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>toast(`${b.dataset.plan} is a sample plan; payments are not connected.`));document.querySelectorAll('[data-ent]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ent]').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(`${b.dataset.ent} category selected`)})}
function updateGrid(){let f=$('#filters .active')?.dataset.filter||'all';$('#toolGrid').innerHTML=toolCards(f,$('#toolSearch').value)}
let currentTool=null;function renderTool(t){currentTool=t;$('#content').innerHTML=pageTool(t);$('#crumb').textContent=t[1];$('#sidebar').classList.remove('open');bindPage()}
function saveToolProject(){let name=$('#projectName').value.trim()||currentTool[1],prompt=$('#prompt').value.trim();projects.push({name,tool:currentTool[1],kind:'Project setup',date:new Date().toLocaleString(),toolId:currentTool[0],prompt});save();toast('Project setup saved')}
function previewInput(){let file=$('#upload')?.files?.[0];if(!file){$('#preview').textContent='Add a source file to preview it.';return}let url=URL.createObjectURL(file);if(lastPreviewUrl)URL.revokeObjectURL(lastPreviewUrl);lastPreviewUrl=url;let el;if(file.type.startsWith('image/')){el=document.createElement('img');el.src=url}else if(file.type.startsWith('video/')){el=document.createElement('video');el.src=url;el.controls=true}else if(file.type.startsWith('audio/')){el=document.createElement('audio');el.src=url;el.controls=true}else{$('#preview').textContent=file.name;return}$('#preview').replaceChildren(el)}
function downloadBrief(){let data={tool:currentTool[1],project:$('#projectName').value,prompt:$('#prompt').value,style:$('#style').value,quality:$('#quality').value,aspectRatio:$('#ratio').value,variations:$('#count').value,createdAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='itfm-ai-project-brief.json';a.click();URL.revokeObjectURL(a.href);downloads.push({name:data.project,tool:currentTool[1],kind:'Project brief',date:new Date().toLocaleString()});save();toast('Project brief downloaded')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#year').textContent=new Date().getFullYear();render('home');
</script></body></html>
