<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0718">
<meta name="color-scheme" content="dark light">
<meta name="description" content="ITFM AI — Creative Operating System">
<title>ITFM AI — Creative OS</title>
<link rel="stylesheet" href="/styles.css">

</head>
<body>
<div id="app"><div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;color:#fff;background:#0b0718">
<div><h2 style="margin:0 0 8px">ITFM AI</h2><p style="color:#9299aa">Loading Creative OS…</p></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a)a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#0b0718;color:#fff"><div style="max-width:620px"><h2>ITFM AI could not load</h2><p style="color:#9299aa">The frontend reported an error. Refresh after redeploying the latest files.</p><pre style="white-space:pre-wrap;color:#fb7185">'+String(e.message||e.error||'Unknown error').replace(/[&<>]/g,function(s){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[s]})+'</pre></div></div>';
});
</script>
<script src="/app.js" defer></script>
</body>
</html>
